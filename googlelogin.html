<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Cloud Console Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #202124;
            background: #f8fafd;
        }

        /* Header */
        .header {
            height: 65px;
            background: white;
            border-bottom: 1px solid #dadce0;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 25px;
        }

        .logo {
            font-size: 21px;
            white-space: nowrap;
        }

        .logo span:nth-child(1),
        .logo span:nth-child(4) {
            color: #4285f4;
        }

        .logo span:nth-child(2),
        .logo span:nth-child(6) {
            color: #ea4335;
        }

        .logo span:nth-child(3) {
            color: #fbbc05;
        }

        .logo span:nth-child(5) {
            color: #34a853;
        }

        .cloud {
            color: #5f6368;
        }

        .search {
            flex: 1;
            max-width: 650px;
        }

        .search input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            background: #f1f3f4;
            font-size: 14px;
        }

        .profile {
            margin-left: auto;
            background: #1a73e8;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: grid;
            place-items: center;
        }

        /* Layout */
        .layout {
            display: flex;
            min-height: calc(100vh - 65px);
        }

        .sidebar {
            width: 240px;
            background: white;
            border-right: 1px solid #dadce0;
            padding: 20px 10px;
            flex-shrink: 0;
        }

        .sidebar h3 {
            font-size: 12px;
            color: #5f6368;
            padding: 0 15px;
            text-transform: uppercase;
        }

        .nav-item {
            padding: 12px 15px;
            margin: 4px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #e8f0fe;
            color: #1967d2;
        }

        /* Main content */
        .main {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .project-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .project-bar h1 {
            font-size: 25px;
            font-weight: 400;
            margin: 0;
        }

        .project-select {
            padding: 10px 15px;
            background: white;
            border: 1px solid #dadce0;
            border-radius: 5px;
            font-size: 14px;
        }

        .welcome {
            padding: 25px;
            border-radius: 10px;
            background: linear-gradient(110deg, #e8f0fe, #e6f4ea);
            margin-bottom: 25px;
        }
